unbind C-b
set -g prefix C-s
bind C-s send-prefix

set -g mouse on
set -g history-limit 100000
set -g status-keys vi
set -g mode-keys vi
set -s escape-time 10
set -g focus-events on
set -g default-terminal "tmux-256color"

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

set -as terminal-features ",*:RGB"
set -g xterm-keys on
set -g renumber-windows on

set -g status-position top
set -g status-interval 5
set -g status-style 'fg=#c5c8c6 bg=default'
set -g message-style 'fg=#c5c8c6,bg=#282a2e'
set -g message-command-style 'fg=#c5c8c6,bg=#282a2e'
set -g status-right ""

set -g status-justify absolute-centre
setw -g window-status-current-style 'fg=#b5bd68 bold bg=default'
setw -g window-status-style 'fg=#969896'
setw -g window-status-format "#I:#W"
setw -g window-status-current-format "#I:#W"

# Tomorrow Night theme
set -g pane-border-style 'fg=#373b41'
set -g pane-active-border-style 'fg=#81a2be'
set -g mode-style 'fg=#1d1f21,bg=#81a2be'
set -g display-panes-colour '#969896'
set -g display-panes-active-colour '#b5bd68'
set -g clock-mode-colour '#81a2be'
