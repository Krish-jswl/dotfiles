# BACKGROUND
background {
    monitor =
    path = screenshot

    blur_passes = 3
    blur_size = 6

    contrast = 1
    brightness = 0.72

    vibrancy = 0.12
    vibrancy_darkness = 0.20
}

# GENERAL
general {
    hide_cursor = true
    ignore_empty_input = true
}

# INPUT FIELD
input-field {
    monitor =

    size = 260, 54

    outline_thickness = 3

    dots_size = 0.30
    dots_spacing = 0.18
    dots_center = true

    # Gruvbox Material Palette
    outer_color = rgba(216, 166, 87, 0.95)      # #d8a657
    inner_color = rgba(40, 40, 40, 0.88)        # #282828
    font_color = rgb(212, 190, 152)             # #d4be98

    check_color = rgb(169, 182, 101)            # #a9b665
    fail_color = rgb(234, 105, 98)              # #ea6962

    font_family = JetBrainsMono Nerd Font Mono

    fade_on_empty = true
    rounding = 14

    fail_text = Incorrect
    placeholder_text = Password...

    hide_input = false

    position = 0, -180
    halign = center
    valign = center
}

# TIME
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"

    color = rgba(212, 190, 152, 0.96)           # #d4be98

    font_size = 118
    font_family = JetBrainsMono Nerd Font Bold

    position = 0, 90

    halign = center
    valign = center
}

# DATE
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %d %B")"

    color = rgba(125, 174, 163, 0.90)           # #7daea3

    font_size = 24
    font_family = JetBrainsMono Nerd Font

    position = 0, -5

    halign = center
    valign = center
}
