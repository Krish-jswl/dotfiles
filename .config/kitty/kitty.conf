font_family Iosevka Nerd Font
font_size 17

hide_window_decorations no

window_padding_width 12

cursor_shape block
cursor_blink_interval 0
cursor_trail 3
cursor_trail_decay 0.08 0.3

scrollback_lines 50000

enable_audio_bell no
visual_bell_duration 0.0
window_alert_on_bell no
bell_on_tab no
command_on_bell none

confirm_os_window_close 0

copy_on_select yes
strip_trailing_spaces smart
mouse_hide_wait 2.0
remember_window_size no

sync_to_monitor yes
repaint_delay 10
input_delay 3

tab_bar_style powerline
tab_powerline_style slanted

foreground              #c5c8c6
background              #1d1f21
selection_foreground    #c5c8c6
selection_background    #373b41
cursor                  #c5c8c6
cursor_text_color       #1d1f21
url_color               #81a2be

active_border_color     #81a2be
inactive_border_color   #373b41
bell_border_color       #f0c674

tab_bar_background      #1d1f21
active_tab_foreground   #1d1f21
active_tab_background   #81a2be
inactive_tab_foreground #c5c8c6
inactive_tab_background #282a2e

